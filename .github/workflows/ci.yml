name: ci

"on":
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p auctioning
      - run: cargo test -p auctioning-magicblock
      - run: cargo test -p shuttle-auctioning
