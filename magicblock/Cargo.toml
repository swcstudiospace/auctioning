[package]
name = "auctioning-magicblock"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
rust-version = "1.86"
description = "MagicBlock Ephemeral Rollup race session client + settlement helpers"

[dependencies]
solana-client = "2"
solana-sdk = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[features]
default = []
tests-needing-tokio = ["tokio"]
