[package]
name = "shuttle-auctioning"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"

[dependencies]
auctioning-core = { path = "../../magicblock", package = "auctioning-magicblock" }
shuttle-axum = "0.57"
shuttle-runtime = "0.57"
shuttle-shared-db = { version = "0.57", features = ["postgres", "sqlx"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
# NOTE: pinned to sqlx 0.8 because shuttle-shared-db 0.57 implements its
# PgPool bridge against sqlx 0.8; mixing 0.9 here breaks the shuttle macro.
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", features = ["json"] }
bs58 = "0.5"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
solana-sdk = "2"
bincode = "1.3"
base64 = "0.21"
tower-http = { version = "0.7", features = ["cors", "trace"] }

[package.metadata.shuttle]
# deployed via `shuttle deploy`
name = "auctioning-backend"

[features]
sqlx-test = []

[[bin]]
name = "auctioning-api-runner"
path = "src/bin/auctioning-api-runner.rs"
