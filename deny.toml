# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
# Run: cargo deny check

[graph]
all-features = false
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "wasm32-unknown-unknown" },
]

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Only flag unmaintained crates we depend on directly; solana-sdk 2.x pulls
# several transitively (atty, paste, derivative, bincode 1, libsecp256k1 …).
unmaintained = "workspace"
# Accepted-risk list. Every entry is transitive via solana-sdk / solana-client 2.x
# and cannot be bumped from this workspace. Re-check on every solana-* upgrade
# (Dependabot groups them) and delete entries as they clear.
ignore = [
  { id = "RUSTSEC-2022-0093", reason = "ed25519-dalek 1.x oracle: solana-sdk pins it; we never sign with the affected API" },
  { id = "RUSTSEC-2024-0344", reason = "curve25519-dalek timing: transitive via solana-sdk" },
  { id = "RUSTSEC-2025-0141", reason = "transitive via solana crates" },
  { id = "RUSTSEC-2026-0098", reason = "rustls-webpki 0.101 name constraints: transitive via solana-pubsub-client; we only dial known MagicBlock/Solana hosts" },
  { id = "RUSTSEC-2026-0099", reason = "rustls-webpki 0.101 wildcard: see above" },
  { id = "RUSTSEC-2026-0104", reason = "rustls-webpki 0.101 CRL panic: we do not use CRLs" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "OpenSSL",
  "BSL-1.0",
  "AGPL-3.0",
  "AGPL-3.0-only",
  "CDLA-Permissive-2.0",
  "Unlicense",
  "0BSD",
  "MIT-0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# openssl is pulled transitively by solana-secp256r1-program; our own HTTP/WS
# stacks (reqwest, tokio-tungstenite, sqlx) are rustls. Do not add openssl
# directly.
deny = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
