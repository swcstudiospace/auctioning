[package]
name = "auctioning"
version = "0.2.0"
description = "auctioning.lol — public RP ledger on Solana mainnet"
edition = "2021"
license.workspace = true
repository.workspace = true
rust-version = "1.86"

[lib]
crate-type = ["cdylib", "lib"]
name = "auctioning"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "1.1", features = ["init-if-needed"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic", "no-log-ix-name", "solana"))',
    'cfg(target_os, values("solana"))',
] }

[dev-dependencies]
borsh = "1"
# LiteSVM suite (tests/onchain.rs). Versions track litesvm 0.16's SDK split.
litesvm = "0.16"
solana-address = "2.6"
solana-instruction = "3.4"
solana-keypair = "3.1"
solana-message = "4.2"
solana-signer = "3.0"
solana-transaction = "4.1"
sha2 = "0.10"
